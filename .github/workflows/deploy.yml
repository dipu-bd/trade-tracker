name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy. Defaults to the commit being built.
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        run: echo "tag=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.pick.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.SSH_SECRET }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship the compose file
        run: |
          ssh -i ~/.ssh/deploy.pem "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p ${{ secrets.DEPLOY_PATH }}"
          scp -i ~/.ssh/deploy.pem docker-compose.prod.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.yml"

      - name: Write the runtime environment
        # Piped over stdin so the values never appear in an argument list or the job log.
        run: |
          printf '%s\n' "${{ secrets.ENV_FILE }}" | ssh -i ~/.ssh/deploy.pem \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cat > ${{ secrets.DEPLOY_PATH }}/.env && chmod 600 ${{ secrets.DEPLOY_PATH }}/.env"

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy.pem "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export TRADEBOT_IMAGE="${{ env.IMAGE }}:${{ needs.publish.outputs.tag }}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Wait for the container to report healthy
        # The image already declares a HEALTHCHECK against /api/health, so this reuses it rather
        # than inventing a second definition of "up".
        run: |
          ssh -i ~/.ssh/deploy.pem "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'EOF'
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            for attempt in $(seq 1 30); do
              container=$(docker compose ps -q api)
              state=$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || echo starting)
              if [ "$state" = healthy ]; then
                echo "healthy after $attempt checks"
                exit 0
              fi
              sleep 5
            done
            echo "api never became healthy; last state: $state" >&2
            docker compose logs --tail 50 api >&2
            exit 1
          EOF
