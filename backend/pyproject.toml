[project]
name = "tradebot"
version = "0.1.0"
description = "AI paper-trading portfolio manager"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "websockets>=14.1",
    "apscheduler>=3.11,<4",
    "cryptography>=44.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "exchange-calendars>=4.8",
    "openai>=1.59",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "freezegun>=1.5",
    "hypothesis>=6.123",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/versions/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tradebot.analytics.*", "tradebot.broker.*", "tradebot.ai.*"]
strict = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
